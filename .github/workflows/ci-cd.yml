name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check migrations are up to date
      run: |
        cd backend
        python manage.py makemigrations --check --dry-run
    - name: Run tests
      run: |
        cd backend
        python -m pytest -v

  build-and-deploy:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
    - uses: actions/checkout@v4
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    - name: Build and push Docker image
      run: |
        gcloud builds submit backend --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/grana-ai-backend:$GITHUB_SHA
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy grana-ai-backend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/grana-ai-backend:$GITHUB_SHA \
          --platform managed \
          --region southamerica-east1 \
          --allow-unauthenticated \
          --set-env-vars "DEBUG=False,USE_SQLITE=False,ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }},SECRET_KEY=${{ secrets.SECRET_KEY }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_HOST=${{ secrets.DB_HOST }},DB_PORT=${{ secrets.DB_PORT }},REDIS_URL=${{ secrets.REDIS_URL }},PLUGGY_CLIENT_ID=${{ secrets.PLUGGY_CLIENT_ID }},PLUGGY_CLIENT_SECRET=${{ secrets.PLUGGY_CLIENT_SECRET }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
